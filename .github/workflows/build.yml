name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build fat JAR
        run: gradle clean shadowJar --no-daemon

      - name: Download apktool
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "APKTOOL_JAR=$PWD/apktool.jar" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)" >> $GITHUB_PATH

      - name: Reference differential audit
        if: ${{ hashFiles('reference/**') != '' }}
        run: python3 tools/differential_test.py

      - name: CLI smoke test
        run: |
          java -jar build/libs/dex2c-cli-2.2.0-all.jar --version
          java -jar build/libs/dex2c-cli-2.2.0-all.jar --help > /tmp/dex2c-help.txt
          grep -q -- "--min-sdk" /tmp/dex2c-help.txt
          grep -q -- "--target-sdk" /tmp/dex2c-help.txt
          grep -q -- "--native-api" /tmp/dex2c-help.txt

      - name: Full dex2c APK build (when fixture is supplied)
        if: ${{ hashFiles('test/app-release.apk') != '' }}
        run: java -jar build/libs/dex2c-cli-2.2.0-all.jar --command build --input "test/app-release.apk" --output build/dex2c-out.apk --min-sdk 21 --native-api 35 --target-sdk 35

      - name: Verify built APK
        if: ${{ hashFiles('test/app-release.apk') != '' }}
        run: |
          unzip -t build/dex2c-out.apk > /dev/null
          unzip -lv build/dex2c-out.apk | grep -E "classes[0-9]*\.dex|lib/.+/lib.*\.so"
          ZALIGN=$(ls $ANDROID_HOME/build-tools/*/zipalign | tail -1)
          "$ZALIGN" -c -P 16 4 build/dex2c-out.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify build/dex2c-out.apk

      - name: Upload APK artifact
        if: ${{ hashFiles('test/app-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dex2c-out
          path: build/dex2c-out.apk
          if-no-files-found: error
