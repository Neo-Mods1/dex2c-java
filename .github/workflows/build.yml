name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build fat JAR and test classes
        run: ./gradlew clean shadowJar testClasses --no-daemon

      - name: Smoke tests
        run: |
          java -cp build/classes/java/test:build/libs/dex2c-cli-2.0.0-all.jar bin.nt.dex2c.PortSmokeTest
          java -cp build/classes/java/test:build/libs/dex2c-cli-2.0.0-all.jar bin.nt.dex2c.WriterSmokeTest

      - name: Compile test APK (source only)
        run: java -jar build/libs/dex2c-cli-2.0.0-all.jar --input "test/NT Manager_1.0.apk" --output build/apk-out

      - name: Inspect test APK
        run: java -jar build/libs/dex2c-cli-2.0.0-all.jar --command inspect --input "test/NT Manager_1.0.apk" > /dev/null

      - name: Full dex2c APK build (NDK, repack, sign)
        run: java -jar build/libs/dex2c-cli-2.0.0-all.jar --command build --input "test/NT Manager_1.0.apk" --output build/dex2c-out.apk

      - name: Verify built APK
        run: |
          unzip -t build/dex2c-out.apk > /dev/null
          unzip -lv build/dex2c-out.apk | grep -E "classes[0-9]*\.dex|lib/.+/lib.*\.so"
          unzip -l build/dex2c-out.apk | grep -qE "lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/libstub\.so" || { echo "no compiled lib in apk"; exit 1; }
          NO_SIZE=$(unzip -l build/dex2c-out.apk | grep -E "lib/.*/libstub\.so" | awk '{print $1}' | head -1)
          [ "$NO_SIZE" -gt 100000 ] || { echo "libstub.so too small ($NO_SIZE bytes) - compiled methods missing"; exit 1; }
          ZALIGN=$(ls $ANDROID_HOME/build-tools/*/zipalign | tail -1)
          "$ZALIGN" -c -p -P 16 4 build/dex2c-out.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify build/dex2c-out.apk
          java -jar build/libs/dex2c-cli-2.0.0-all.jar --command inspect --input build/dex2c-out.apk | grep -c "native" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex2c-cli-2.0.0
          path: |
            build/libs/dex2c-cli-2.0.0-all.jar
            build/dex2c-out.apk
          if-no-files-found: error
