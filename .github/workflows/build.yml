name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build fat JAR
        run: ./gradlew clean shadowJar --no-daemon --stacktrace

      - name: Smoke tests
        run: |
          java -cp build/libs/dex2c-cli-2.0.0-all.jar bin.nt.dex2c.PortSmokeTest
          java -cp build/libs/dex2c-cli-2.0.0-all.jar bin.nt.dex2c.WriterSmokeTest

      - name: Compile test APK
        run: java -jar build/libs/dex2c-cli-2.0.0-all.jar --input "test/NT Manager_1.0.apk" --output build/apk-out

      - name: Inspect test APK
        run: java -jar build/libs/dex2c-cli-2.0.0-all.jar --command inspect --input "test/NT Manager_1.0.apk" > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex2c-cli-2.0.0
          path: build/libs/dex2c-cli-2.0.0-all.jar
          if-no-files-found: error
